[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbx-fabric-security"
version = "0.1.0"
description = "Spike toolkit: extract Databricks Unity Catalog view security (CLS/RLS) and translate it into Microsoft Fabric security constructs."
requires-python = ">=3.10"
dependencies = [
    "sqlglot>=25.0.0",
    "requests>=2.31.0",
]

[project.scripts]
dbx-fabric-security = "dbx_fabric_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
