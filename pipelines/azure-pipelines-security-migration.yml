# Azure DevOps pipeline: Fabric-side translate/validate/deploy.
#
# Stages: Resolve views input -> Translate -> Validate -> (manual approval) -> Deploy -> Report.
#
# This pipeline never talks to Databricks directly -- it consumes the
# extraction artifact produced by the Databricks-side pipeline
# (pipelines/azure-pipelines-databricks-extract.yml), or (for local
# dev/test only) a checked-in SQL file. That split lets extraction run
# under a Databricks-scoped identity and translate/deploy run under a
# Fabric-scoped identity, per README.md's "Running the stages separately".
# In the target end state, one Azure AD application/service principal with
# access on both sides (README.md "RBAC / permissions required") can run
# both pipelines; the split here is an interim operating model, not a
# structural requirement of the toolkit -- `extractSource: localFile` plus
# a `DATABRICKS_TOKEN` variable would let a single merged pipeline do both
# in one run if that's preferred later.
#
# Required pipeline variables / variable group ("dbx-fabric-security-migration"):
#   FABRIC_API_TOKEN          - service principal bearer token for the Fabric API
#                                (issued via an Azure AD app registration with
#                                Fabric API permissions; store as a secret variable)
#   DATABRICKS_VIEWS_PATH     - only used when extractSource=localFile: path (in
#                                this repo or an artifact drop) to exported view DDL
#   DATABRICKS_GRANTS_PATH    - only used when extractSource=localFile: path to a
#                                grants CSV (view,principal,principal_object_id,
#                                privilege) -- who holds SELECT on each view, and
#                                their Azure AD object id; this is the sole source
#                                of CLS/RLS access, never inferred from view SQL
#                                or from any AD-Group-Sync (AGS) export
#   DATABRICKS_TABLE_COLUMNS_PATH - only used when extractSource=localFile: path to
#                                a JSON file {catalog.schema.table: [col1, col2, ...]}
#                                used to correctly attribute an unqualified column in
#                                a joined view to its real source table (see README
#                                "Column-to-table attribution"); optional -- omitting
#                                it just falls back to the first base table, flagged
#   FABRIC_DEPLOY_TARGETS     - path to a JSON file with "schemas" and/or "tables"
#                                keys mapping a Databricks catalog.schema (or an
#                                exact catalog.schema.table override) to the Fabric
#                                {workspaceId, itemId} that owns it -- one schema
#                                entry covers every table under it, since base
#                                table names are kept identical between Databricks
#                                and Fabric (see README "Target resolution")
#
# The Deploy stage only runs against the `--apply` flag after an environment
# approval gate (`fabric-security-prod`), keeping a human in the loop for any
# change that actually mutates Fabric role assignments.

trigger: none # run on-demand or via a schedule trigger; security changes should not auto-deploy on every commit

parameters:
  - name: extractSource
    displayName: "Where should extracted view DDL come from?"
    type: string
    default: databricksPipeline
    values:
      - databricksPipeline # consume the artifact published by azure-pipelines-databricks-extract.yml (production default)
      - localFile          # use $(DATABRICKS_VIEWS_PATH) directly (dev/test only, no Databricks connectivity needed)

resources:
  pipelines:
    - pipeline: databricksExtract
      # Must match the *name* of the Azure DevOps pipeline created from
      # pipelines/azure-pipelines-databricks-extract.yml in this project.
      # Update this to the real pipeline name once it exists; irrelevant
      # when extractSource=localFile.
      source: "Databricks Security Extraction"
      trigger: none # set true to auto-run this pipeline whenever a Databricks extraction succeeds

pool:
  vmImage: ubuntu-latest

variables:
  - group: dbx-fabric-security-migration
  - name: pythonVersion
    value: "3.11"
  - name: outDir
    value: "$(Pipeline.Workspace)/security-migration-out"

stages:
  - stage: ResolveViewsInput
    displayName: "Resolve extracted view DDL input"
    jobs:
      - job: ResolveViewsJob
        steps:
          - ${{ if eq(parameters.extractSource, 'databricksPipeline') }}:
              - download: databricksExtract
                artifact: extracted-views
              - script: |
                  mkdir -p "$(outDir)"
                  cp "$(Pipeline.Workspace)/databricksExtract/extracted-views/extracted_views.sql" \
                     "$(outDir)/extracted_views.sql"
                  cp "$(Pipeline.Workspace)/databricksExtract/extracted-views/extracted_grants.csv" \
                     "$(outDir)/extracted_grants.csv"
                  cp "$(Pipeline.Workspace)/databricksExtract/extracted-views/extracted_table_columns.json" \
                     "$(outDir)/extracted_table_columns.json"
                  echo "##vso[task.setvariable variable=viewsPath;isOutput=true]$(outDir)/extracted_views.sql"
                  echo "##vso[task.setvariable variable=grantsPath;isOutput=true]$(outDir)/extracted_grants.csv"
                  echo "##vso[task.setvariable variable=tableColumnsPath;isOutput=true]$(outDir)/extracted_table_columns.json"
                name: setViewsPath
                displayName: "Use extraction artifact from Databricks pipeline"
          - ${{ if eq(parameters.extractSource, 'localFile') }}:
              - script: |
                  echo "##vso[task.setvariable variable=viewsPath;isOutput=true]$(DATABRICKS_VIEWS_PATH)"
                  echo "##vso[task.setvariable variable=grantsPath;isOutput=true]$(DATABRICKS_GRANTS_PATH)"
                  echo "##vso[task.setvariable variable=tableColumnsPath;isOutput=true]$(DATABRICKS_TABLE_COLUMNS_PATH)"
                name: setViewsPath
                displayName: "Use local view SQL + grants CSV + table-columns JSON (dev/test)"

  - stage: Translate
    displayName: "Translate CLS/RLS into Fabric roles"
    dependsOn: ResolveViewsInput
    variables:
      viewsPath: $[ stageDependencies.ResolveViewsInput.ResolveViewsJob.outputs['setViewsPath.viewsPath'] ]
      grantsPath: $[ stageDependencies.ResolveViewsInput.ResolveViewsJob.outputs['setViewsPath.grantsPath'] ]
      tableColumnsPath: $[ stageDependencies.ResolveViewsInput.ResolveViewsJob.outputs['setViewsPath.tableColumnsPath'] ]
    jobs:
      - job: TranslateJob
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
          - script: |
              pip install -e ./databricks-fabric-security-migration
            displayName: "Install toolkit"
          - script: |
              python -m dbx_fabric_security.cli translate \
                --views "$(viewsPath)" \
                --grants "$(grantsPath)" \
                --table-columns "$(tableColumnsPath)" \
                --out-dir "$(outDir)"
            displayName: "Run translation"
          - script: |
              python -m dbx_fabric_security.cli map-roles \
                --views "$(viewsPath)" \
                --grants "$(grantsPath)" \
                --table-columns "$(tableColumnsPath)" \
                --out-dir "$(outDir)"
            displayName: "Build AD Group/principal -> Fabric Role mapping"
          - publish: "$(outDir)"
            artifact: translated-security-model

  - stage: Validate
    displayName: "Validate translation output"
    dependsOn: Translate
    jobs:
      - job: ValidateJob
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
          - script: |
              pip install -e ./databricks-fabric-security-migration
              pip install pytest
            displayName: "Install toolkit + test deps"
          - script: |
              pytest ./databricks-fabric-security-migration/tests -v
            displayName: "Run unit tests"
          - download: current
            artifact: translated-security-model
          - script: |
              python - <<'PY'
              import json, sys
              path = "$(Pipeline.Workspace)/translated-security-model/fabric_data_access_roles.json"
              roles = json.load(open(path))
              unresolved = [r["name"] for r in roles if r.get("unresolvedPrincipalObjectId")]
              if unresolved:
                  print(f"::warning::{len(unresolved)} role(s) reference a principal with no known "
                        f"Azure AD object id (missing from the grants CSV's principal_object_id "
                        f"column) and cannot be deployed as-is: {unresolved}")
              print(f"Validated {len(roles)} Fabric role definition(s).")
              PY
            displayName: "Flag unresolved principal object ids"

  - stage: DeployApproval
    displayName: "Manual approval gate"
    dependsOn: Validate
    jobs:
      - deployment: ApprovalGate
        environment: "fabric-security-prod" # configure required-reviewer check on this environment
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Approved for deployment"

  - stage: Deploy
    displayName: "Deploy Fabric roles"
    dependsOn:
      - DeployApproval
      - ResolveViewsInput
    variables:
      viewsPath: $[ stageDependencies.ResolveViewsInput.ResolveViewsJob.outputs['setViewsPath.viewsPath'] ]
      grantsPath: $[ stageDependencies.ResolveViewsInput.ResolveViewsJob.outputs['setViewsPath.grantsPath'] ]
      tableColumnsPath: $[ stageDependencies.ResolveViewsInput.ResolveViewsJob.outputs['setViewsPath.tableColumnsPath'] ]
    jobs:
      - job: DeployJob
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
          - script: |
              pip install -e ./databricks-fabric-security-migration
            displayName: "Install toolkit"
          - script: |
              python -m dbx_fabric_security.cli deploy \
                --views "$(viewsPath)" \
                --grants "$(grantsPath)" \
                --table-columns "$(tableColumnsPath)" \
                --targets "$(FABRIC_DEPLOY_TARGETS)" \
                --bearer-token "$(FABRIC_API_TOKEN)" \
                --apply \
                --out-dir "$(outDir)"
            displayName: "Deploy roles to Fabric (live)"
          - publish: "$(outDir)/deployment_report.json"
            artifact: deployment-report

  - stage: Report
    displayName: "Publish governance report"
    dependsOn: Deploy
    condition: always()
    jobs:
      - job: ReportJob
        steps:
          - download: current
            artifact: deployment-report
          - download: current
            artifact: translated-security-model
          - publish: "$(Pipeline.Workspace)"
            artifact: security-migration-run-$(Build.BuildId)
